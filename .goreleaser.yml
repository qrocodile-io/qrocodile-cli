version: 2

project_name: qrocodile

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/qrocodile
    binary: qrocodile
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/qrocodile-io/qrocodile-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  # CHANGELOG.md is the real release notes source (see the release workflow, which extracts
  # this version's section from it) — this is only the commit list GoReleaser also attaches,
  # kept short rather than disabled outright since it costs nothing and some people do read it.
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - repository:
      owner: qrocodile-io
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://qrocodile.io
    description: Generate styled QR codes (SVG or PNG) from a terminal, script, or CI pipeline — the QRocodile CLI.
    license: MIT
    install: |
      bin.install "qrocodile"
    test: |
      system "#{bin}/qrocodile", "version"
